server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: technicians
          uri: lb://technician-service
          predicates: [ Path=/api/technicians/** ]
        - id: repairs
          uri: lb://repair-service
          predicates: [ Path=/api/repairs/** ]
        - id: reviews
          uri: lb://review-service
          predicates: [ Path=/api/reviews/** ]
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
